  - id: differential-review
    name: differential-review
    pack: core
    summary: A security review of a diff. It sizes the blast radius, checks git history for reintroduced bugs and flags changed code that no test covers.
    benefit: [quality]
    details: docs/items/differential-review.md
    kinds: [skill]
    agents: [claude-code, command-code, codex, gemini-cli, generic]
    source: { type: npx-skills, ref: trailofbits/skills }
    redistribution: upstream-public
    risk: low
    token_cost: 134 # est
    install:
      skills: { repo: trailofbits/skills, names: [differential-review] }
    # The upstream skill delegates to a plugin-only subagent. Ship its brief beside the skill and
    # point the skill at a general-purpose subagent instead (both edits are idempotent).
    post_install:
      - curl -fsSL https://raw.githubusercontent.com/trailofbits/skills/711af095215ad4ecde5b90cd1d0124b3f1c4ca9e/plugins/differential-review/agents/adversarial-modeler.md -o ~/.agents/skills/differential-review/adversarial-modeler.md
      - |-
        test -f "$HOME/.agents/skills/differential-review/SKILL.md" || { echo "missing $HOME/.agents/skills/differential-review/SKILL.md" >&2; exit 1; } && perl -0pi -e 's/differential-review:adversarial-modeler agent/a general-purpose subagent briefed with adversarial-modeler.md/; s/\*\*`differential-review:adversarial-modeler`\*\*.*?fails at runtime\./**Adversarial modeler** — Models attacker perspectives and builds exploit scenarios for\nHIGH RISK code changes using the 5-step adversarial methodology (attacker model, attack\nvectors, exploitability rating, exploit scenario, baseline cross-reference). When Phase 5\nanalysis is needed, delegate to a general-purpose subagent and include the full contents of\n`adversarial-modeler.md` (in this skill\x27s directory) as its instructions, plus the high-risk\nchanges to analyze. If subagents are unavailable, read `adversarial.md` and do it inline./s' ~/.agents/skills/differential-review/SKILL.md
    detect: test -f ~/.agents/skills/differential-review/SKILL.md
    verify: test -f ~/.agents/skills/differential-review/adversarial-modeler.md && ! grep -q 'differential-review:adversarial-modeler' ~/.agents/skills/differential-review/SKILL.md

