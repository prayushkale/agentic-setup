  - id: accept-gate
    name: Accept gate (Stop hook)
    pack: verification
    summary: A Claude Code hook that blocks a "done" claim while an acceptance check is still open or the locked checks have been edited. It also rejects out-of-order task ledger writes.
    benefit: [quality]
    details: docs/items/accept-gate.md
    kinds: [hook]
    agents: [claude-code]
    source: { type: local, ref: packs/verification/accept-gate }
    redistribution: own
    risk: med
    risk_reason: "Open bypass: the agent can rewrite the pin file unless an OS sandbox denies writes to it."
    token_cost: 0
    requires: [acceptance-checks, "node>=20"]
    install:
      files:
        - { from: packs/verification/accept-gate/accept-gate.mjs, to: ~/.agentic-setup/accept-gate/accept-gate.mjs }
        - { from: packs/verification/accept-gate/pending.mjs, to: ~/.agentic-setup/accept-gate/pending.mjs }
      hooks:
        claude-code: { event: Stop, command: "node \"$HOME/.agentic-setup/accept-gate/accept-gate.mjs\"" }
      # The same script also guards ledger writes; HookSpec holds one event, so the second goes in settings.
      settings:
        hooks:
          PreToolUse:
            - matcher: Write|Edit|MultiEdit
              hooks: [{ type: command, command: "node \"$HOME/.agentic-setup/accept-gate/accept-gate.mjs\"" }]
    verify: test -f ~/.agentic-setup/accept-gate/accept-gate.mjs && grep -qs 'accept-gate/accept-gate.mjs' ~/.claude/settings.json

