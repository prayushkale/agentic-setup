    summary: Shows the session's cost, today's spend, the 5-hour usage block and context use in Claude Code's status line.
    benefit: [cost]
    details: docs/items/ccusage-statusline.md
    kinds: [cli-tool, settings]
    agents: [claude-code]
    source: { type: npm, ref: ccusage }
    redistribution: upstream-public
    risk: low
    token_cost: 0
    install:
      commands: ["npm i -g ccusage"]
      commands_unless: command -v ccusage
      settings:
        statusLine: { type: command, command: "ccusage statusline -B emoji", padding: 0 }
    uninstall: ["npm uninstall -g ccusage"]
    update: ["npm i -g ccusage"]
    detect: command -v ccusage >/dev/null && grep -qs '"ccusage statusline' ~/.claude/settings.json
    verify: command -v ccusage >/dev/null && grep -qs '"ccusage statusline' ~/.claude/settings.json

