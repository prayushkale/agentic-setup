        test -f "$HOME/.agents/skills/ui-ux-pro-max/SKILL.md" || { echo "missing $HOME/.agents/skills/ui-ux-pro-max/SKILL.md" >&2; exit 1; } && perl -pi -e 's|\$\{CLAUDE_PLUGIN_ROOT\}/\.claude/skills/ui-ux-pro-max|\$HOME/.agents/skills/ui-ux-pro-max|g' ~/.agents/skills/ui-ux-pro-max/SKILL.md
