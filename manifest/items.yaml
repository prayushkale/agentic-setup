    benefit: [cost, speed]
    details: docs/items/serena.md
    kinds: [cli-tool]
    agents: [claude-code, command-code]
    source: { type: git, ref: https://github.com/oraios/serena }
    redistribution: own
    risk: low
    token_cost: 0
    install:
      commands: ["uv tool install serena-agent"]
