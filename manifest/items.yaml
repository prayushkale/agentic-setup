# agentic-setup catalogue. One item per entry; see installer/src/manifest/types.ts for the schema.
# token_cost: startup tokens. Skills: ceil((len(name)+len(description))/4)+10 per skill, from the
# upstream SKILL.md frontmatter on 2026-11-03. Rules: ceil(bytes/4) of the block. MCPs: 300 unless
# measured. Hooks, status lines and CLIs add nothing at startup. Every estimate is marked `# est`.
# Detect commands are read-only probes: they also run in dry-run.
items:
  # ---------------------------------------------------------------- core
  - id: superpowers
    name: Superpowers (Claude Code plugin)
    pack: core
    summary: A full working method for the agent. It asks questions before building, writes a plan for you to approve, builds with tests first, and reviews its own work before calling it done.
    benefit: [quality]
    details: docs/items/superpowers.md
    kinds: [plugin, skill]
    agents: [claude-code]
    source: { type: plugin-marketplace, ref: obra/superpowers-marketplace }
    redistribution: upstream-public
    risk: low
    token_cost: 1609 # est: 15 skill descriptions (814) + the using-superpowers body injected at session start (795)
    install:
      plugin: { marketplace: obra/superpowers-marketplace, name: superpowers@superpowers-marketplace }
    update: ["claude plugin update superpowers@superpowers-marketplace"]
    detect: claude plugin list 2>/dev/null | grep -q 'superpowers@superpowers-marketplace'
    verify: claude plugin list 2>/dev/null | grep -q 'superpowers@superpowers-marketplace'

  - id: superpowers-skills
    name: Superpowers (skills for other agents)
    pack: core
    summary: The same Superpowers skills for agents without Claude Code's plugin system, installed as plain skills. Claude Code gets the plugin instead.
    benefit: [quality]
    details: docs/items/superpowers-skills.md
    kinds: [skill]
    agents: [command-code, codex, gemini-cli, generic]
    source: { type: npx-skills, ref: obra/superpowers }
    redistribution: upstream-public
    risk: low
    token_cost: 814 # est
    install:
      skills:
        repo: obra/superpowers
        names: [brainstorming, diagnosing-superpowers, dispatching-parallel-agents, executing-plans, finishing-a-development-branch, receiving-code-review, requesting-code-review, subagent-driven-development, systematic-debugging, test-driven-development, using-git-worktrees, using-superpowers, verification-before-completion, writing-plans, writing-skills]
    detect: for s in brainstorming diagnosing-superpowers dispatching-parallel-agents executing-plans finishing-a-development-branch receiving-code-review requesting-code-review subagent-driven-development systematic-debugging test-driven-development using-git-worktrees using-superpowers verification-before-completion writing-plans writing-skills; do test -f ~/.agents/skills/$s/SKILL.md || exit 1; done
    verify: test -f ~/.agents/skills/using-superpowers/SKILL.md

  - id: rtk
    name: rtk (compact shell output)
    pack: core
    summary: Rewrites the agent's shell commands so their output comes back shorter, which cuts the tokens spent reading git, test and build logs.
    benefit: [cost, speed]
    details: docs/items/rtk.md
    kinds: [cli-tool, hook]
    agents: [claude-code]
    source: { type: brew, ref: rtk }
    redistribution: upstream-public
    risk: low
    token_cost: 0
    install:
      commands: ["brew install rtk"]
      commands_unless: command -v rtk
      hooks:
        claude-code: { event: PreToolUse, matcher: Bash, command: "rtk hook claude" }
    uninstall: ["brew uninstall rtk"]
    update: ["brew upgrade rtk"]
    requires: ["brew>=4"]
    detect: command -v rtk >/dev/null && grep -qs 'rtk hook claude' ~/.claude/settings.json
    verify: command -v rtk >/dev/null && grep -qs 'rtk hook claude' ~/.claude/settings.json

