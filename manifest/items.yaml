        - { from: packs/core/serena-here, to: ~/.local/bin/serena-here, mode: 0o755 }
    uninstall: ["uv tool uninstall serena-agent"]
    update: ["uv tool upgrade serena-agent"]
    requires: ["uv>=0.4"]
    detect: command -v serena >/dev/null && test -x ~/.local/bin/serena-here
    verify: command -v serena >/dev/null && test -x ~/.local/bin/serena-here

